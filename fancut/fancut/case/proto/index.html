<!doctype html>
<html lang="en"><head><link rel="icon" href="../../../../favicon.svg" type="image/svg+xml"><link rel="icon" href="../../../../favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../../../../apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>FanCut Prototype</title>
<style>
:root{--bg:#F3F1F6;--ink:#1B1726;--muted:#6E6880;--line:#E2DDEA;--accent:#531DAB;--teal:#25D1DA;--chip:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121014;--ink:#EEEAF4;--muted:#A39DB0;--line:#2C2733;--accent:#B98AEF;--chip:#1D1A22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121014;--ink:#EEEAF4;--muted:#A39DB0;--line:#2C2733;--accent:#B98AEF;--chip:#1D1A22;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.stage{position:relative;height:min(calc(100vh - 110px),852px);aspect-ratio:393/852;max-width:100%}
.phone{position:absolute;inset:0;border-radius:calc(var(--k,1)*48px);background:#000;box-shadow:0 0 0 calc(var(--k,1)*10px) #0b0b0d,0 0 0 calc(var(--k,1)*11px) #2a2a30,0 30px 60px -20px rgba(0,0,0,.45);overflow:hidden}
.vp{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:0 0;overflow:hidden;background:#000}
.scr{position:absolute;inset:0;overflow:hidden;background:#000;will-change:transform,opacity}
.scr .body{position:absolute;inset:0;overflow:hidden}
.scr.scroll .body{overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.scr.scroll .body::-webkit-scrollbar{display:none}
.scr img.bg{display:block;width:393px;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.scr .layer{position:absolute;left:0;top:0;width:393px}
.nav{position:absolute;left:0;bottom:0;width:393px;height:140px;pointer-events:none}
.nav img{width:393px;display:block}
.hs{position:absolute;border:0;padding:0;margin:0;background:transparent;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
.hs:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.show .hs,.flash .hs{background:rgba(37,209,218,.22);box-shadow:inset 0 0 0 1.5px rgba(37,209,218,.9)}
.flash .hs{animation:fl .7s ease-out}
@keyframes fl{from{opacity:1}to{opacity:0}}
.in-r{animation:inr .32s cubic-bezier(.2,.8,.2,1)}.out-l{animation:outl .32s cubic-bezier(.2,.8,.2,1) forwards}
.in-l{animation:inl .32s cubic-bezier(.2,.8,.2,1)}.out-r{animation:outr .32s cubic-bezier(.2,.8,.2,1) forwards}
.in-up{animation:inup .34s cubic-bezier(.2,.8,.2,1)}.out-down{animation:outdown .3s ease-in forwards}
.in-fade{animation:infade .3s ease}.out-fade{animation:outfade .3s ease forwards}
@keyframes inr{from{transform:translateX(100%)}}@keyframes outl{to{transform:translateX(-28%);opacity:.6}}
@keyframes inl{from{transform:translateX(-28%);opacity:.6}}@keyframes outr{to{transform:translateX(100%)}}
@keyframes inup{from{transform:translateY(100%)}}@keyframes outdown{to{transform:translateY(100%)}}
@keyframes infade{from{opacity:0}}@keyframes outfade{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.scr{animation:none!important}}
/* live bits */
.chk{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#062026;display:grid;place-items:center;font:700 13px/1 system-ui;pointer-events:none;box-shadow:0 0 0 2px #000}
.rowsel{position:absolute;left:12px;width:369px;height:72px;border-radius:12px;background:rgba(37,209,218,.12);box-shadow:inset 0 0 0 1px rgba(37,209,218,.6);pointer-events:none}
.plus-ok{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--teal);display:grid;place-items:center;pointer-events:none}
.plus-ok svg{width:16px;height:16px;fill:none;stroke:#062026;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(30,30,34,.96);color:#fff;font:500 13px/1.3 system-ui;padding:9px 14px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.dim{position:absolute;border-radius:22px;background:rgba(0,0,0,.55);pointer-events:none}
.tsel{position:absolute;width:78px;height:97px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--teal);pointer-events:none}
.seg{position:absolute;left:86px;top:106px;width:222px;height:56px;border-radius:28px;background:#4A4A4A;display:flex;align-items:center;padding:8px;gap:6px}
.seg button{all:unset;flex:1;height:40px;border-radius:20px;text-align:center;font:400 15px/40px system-ui;color:#fff;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--teal);color:#062026}
.gen-bar{position:absolute;left:24px;right:24px;top:740px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.gen-bar i{display:block;height:100%;width:0;background:#fff;animation:gb 3.4s linear forwards}
@keyframes gb{to{width:100%}}
.spin{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
.heart{position:absolute;pointer-events:none;font:700 22px system-ui;color:#ff3b6b}
.boxchk{position:absolute;width:24px;height:24px;border-radius:5px;background:#000;box-shadow:inset 0 0 0 2px #888;pointer-events:none}
/* chrome */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;max-width:620px}
.bar button{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 12.5px/1 inherit;font-family:inherit;padding:8px 12px;border-radius:999px;cursor:pointer}
.bar button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.cap{font-size:12.5px;color:var(--muted);text-align:center;min-height:18px}
.cap b{color:var(--ink);font-weight:600}
html.framed .bar button{border:0;border-radius:999px;padding:8px 16px;font:600 13px/20px Poppins,system-ui,sans-serif;background:#D9D9D9;color:#000}
html.framed .bar button[aria-pressed="true"]{background:#531DAB;color:#fff}
html.framed .cap{font:400 13px/1.5 Poppins,system-ui,sans-serif;color:#6B6B6B}html.framed .cap b{color:#000;font-weight:600}
html.framed.dk .bar button{background:#383838;color:#F2F2F2}html.framed.dk .bar button[aria-pressed="true"]{background:#B37FEB;color:#120a1c}
html.framed.dk .cap{color:#9D9D9D}html.framed.dk .cap b{color:#F2F2F2}
html.framed body{background:transparent;justify-content:flex-start;padding-top:16px}html.framed .stage{height:650px!important;flex:none}html.framed .phone{box-shadow:0 0 0 1px rgba(127,127,127,.35)!important;border-radius:36px!important}html.framed{color-scheme:light dark}
</style></head><body>
<script>if(window.frameElement){var R=document.documentElement;R.classList.add("framed");var sync=function(){try{var p=parent.document.documentElement,t=p.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");R.classList.toggle("dk",t==="dark")}catch(e){}};sync();try{new MutationObserver(sync).observe(parent.document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}}</script><div class="stage" id="stage"><div class="phone"><div class="vp" id="vp"></div></div></div>
<p class="cap" id="cap"></p>
<div class="bar">
  <button type="button" id="restart">↺ Restart</button>
  <button type="button" id="jump-make">Jump to create</button>
  <button type="button" id="hints" aria-pressed="false">Show tap areas</button>
</div>
<script>
const S={
 ins:{img:'ins-eva',name:'Instagram story',hint:'Eva shared her FanCut. Tap the link.',hs:[[30,648,210,44,'popup','up']]},
 popup:{img:'popup',name:'FanCut intro',hs:[[340,54,46,46,'home','down'],[24,716,345,46,'music','r'],[120,776,153,30,'home','down']]},
 home:{img:'home',name:'Home',scroll:1,nav:'home',hs:[[20,1807,353,199,'fancut','r'],[20,128,175,66,'play','up']],fixed:[[0,712,393,70,'play','up'],[157,782,79,70,'fancut','fade'],[236,782,78,70,'profile','fade']]},
 fancut:{img:'fancut',name:'FanCut tab',scroll:1,nav:'fancut',hs:[[318,333,62,62,'music','r'],[16,690,361,270,'music','r'],[16,382,361,230,'video','r']],fixed:[[0,712,393,70,'play','up'],[0,782,157,70,'home','fade'],[236,782,78,70,'profile','fade']]},
 play:{img:'play',name:'Now playing',hs:[[38,52,80,80,'home','down'],[290,786,42,42,'playshare','up'],[20,600,180,30,'artist','r']]},
 playshare:{img:'playshare',name:'Share via FanCut Remix',hs:[[0,0,393,160,'play','down'],[107,242,180,320,'music','r'],[234,572,30,30,'music','r']]},
 artist:{img:'artist',name:'Artist page',hs:[[8,48,48,48,'play','l'],[78,330,36,36,'artist2','up'],[240,325,30,44,'video','r']]},
 artist2:{img:'artist2',name:'Song menu',hs:[[0,158,393,47,'music','r'],[150,755,93,34,'artist','down'],[0,0,393,150,'artist','down']]},
 music:{img:'music',name:'Pick a song',live:'music',hs:[[20,54,48,48,'@back','l'],[150,60,104,36,'artistmedia','fade'],[262,60,99,36,'yourmedia','fade'],[216,774,153,40,'@musicnext','r']]},
 artistmedia:{img:'artistmedia',name:'Artist media',live:'grid',grid:{y0:198,cap:9},hs:[[20,54,48,48,'music','l'],[76,60,66,36,'music','fade'],[262,60,99,36,'yourmedia','fade'],[216,774,153,40,'yourmedia','r']]},
 yourmedia:{img:'yourmedia',name:'Your media',live:'grid',grid:{y0:190,cap:9},hs:[[20,54,48,48,'artistmedia','l'],[76,60,66,36,'music','fade'],[150,60,104,36,'artistmedia','fade'],[216,774,153,40,'template','r']]},
 template:{img:'template',name:'Template preview',live:'tpl',hs:[[20,54,48,48,'yourmedia','l'],[24,770,153,44,'generating','fade'],[216,772,153,40,'aieditor','r'],[305,60,72,36,'share','r']]},
 generating:{img:'generating',name:'AI generating',live:'gen',hs:[[247,60,126,36,'home','down']]},
 preview:{img:'preview',name:'AI remix',live:'seg',hs:[[20,54,48,48,'template','l'],[216,770,153,44,'aieditor','r'],[305,60,72,36,'share','r']]},
 aieditor:{img:'aieditor',name:'Editor',hs:[[20,54,48,48,'preview','l'],[8,764,52,60,'clip','up'],[305,60,72,36,'share','r']]},
 clip:{img:'clip',name:'Clip editor',hs:[[24,772,153,40,'aieditor','down'],[216,770,153,44,'share','r']]},
 share:{img:'share',name:'Ready to share',live:'chk',hs:[[20,54,48,48,'aieditor','l'],[24,736,153,44,'sharesheet','up'],[216,738,153,40,'music','l'],[318,60,62,36,'profile','r']]},
 sharesheet:{img:'sharesheet',name:'Share sheet',hs:[[0,0,393,438,'share','down'],[20,725,360,90,'profile','r']]},
 profile:{img:'profile',name:'Your profile',hs:[[20,306,145,260,'video','r'],[14,54,48,48,'home','l'],[0,770,79,80,'home','fade'],[157,770,79,80,'fancut','fade']]},
 video:{img:'video',name:'Your FanCut',live:'like',hs:[[14,54,48,48,'profile','l']]}
};
const ORDER=['ins','popup','home','fancut','play','playshare','artist','artist2','music','artistmedia','yourmedia','template','generating','preview','aieditor','clip','share','sharesheet','profile','video'];
const vp=document.getElementById('vp'),stage=document.getElementById('stage'),cap=document.getElementById('cap');
const hist=[];let cur=null,curEl=null,showHints=false;
const state={song:-1,sel:{artistmedia:[],yourmedia:[]},tpl:1,seg:0,sync:true,liked:false};
function fit(){const w=stage.clientWidth,k=w/393;vp.style.transform=`scale(${k})`;stage.style.setProperty('--k',k)}
addEventListener('resize',fit);
function el(t,c,css){const e=document.createElement(t);if(c)e.className=c;if(css)Object.assign(e.style,css);return e}
function px(v){return v+'px'}
function toast(root,msg){let t=root.querySelector('.toast');if(!t){t=el('div','toast');root.appendChild(t)}t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600)}
function hot(parent,[x,y,w,h,to,tr],label){const b=el('button','hs');b.type='button';Object.assign(b.style,{left:px(x),top:px(y),width:px(w),height:px(h)});b.setAttribute('aria-label',label||('Go to '+(S[to]?S[to].name:to)));b.addEventListener('click',e=>{e.stopPropagation();act(to,tr)});parent.appendChild(b);return b}
function act(to,tr){
 if(to==='@back'){back();return}
 if(to==='@musicnext'){if(state.song<0){toast(curEl,'Must select a song to start');return}go('artistmedia','r');return}
 go(to,tr)}
function build(id){
 const d=S[id],scr=el('div','scr'+(d.scroll?' scroll':''));scr.dataset.id=id;
 const body=el('div','body');scr.appendChild(body);
 const layer=el('div','layer');body.appendChild(layer);
 const img=el('img','bg');img.src='s/'+d.img+'.webp';img.alt=d.name;img.decoding='async';layer.appendChild(img);
 (d.hs||[]).forEach(h=>hot(layer,h));
 if(d.nav){const n=el('div','nav');const ni=el('img');ni.src='s/'+d.nav+'-nav.webp';ni.alt='';n.appendChild(ni);scr.appendChild(n)}
 (d.fixed||[]).forEach(h=>hot(scr,h));
 if(d.live)LIVE[d.live](scr,layer,id,d);
 scr.addEventListener('click',()=>{scr.classList.remove('flash');void scr.offsetWidth;scr.classList.add('flash');setTimeout(()=>scr.classList.remove('flash'),700)});
 return scr}
const LIVE={
 music(scr,layer){const rows=[238,318,398,478,558,638,718];let sel=null,ok=null;
  const paint=()=>{sel&&sel.remove();ok&&ok.remove();sel=ok=null;if(state.song<0)return;const y=rows[state.song];sel=el('div','rowsel',{top:px(y-36)});ok=el('div','plus-ok',{left:px(298),top:px(y-15)});ok.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';layer.appendChild(sel);layer.appendChild(ok)};
  rows.forEach((y,i)=>{const b=el('button','hs',{left:px(16),top:px(y-34),width:px(270),height:px(68)});b.type='button';b.setAttribute('aria-label','Select song '+(i+1));b.addEventListener('click',e=>{e.stopPropagation();state.song=state.song===i?-1:i;paint()});layer.appendChild(b);
   const p=el('button','hs',{left:px(296),top:px(y-17),width:px(34),height:px(34)});p.type='button';p.setAttribute('aria-label','Add song '+(i+1));p.addEventListener('click',e=>{e.stopPropagation();state.song=state.song===i?-1:i;paint()});layer.appendChild(p)});
  paint()},
 grid(scr,layer,id,d){const xs=[16,139,262],sel=state.sel[id],marks=[];
  const paint=()=>{marks.forEach(m=>m.remove());marks.length=0;sel.forEach((k,n)=>{const c=k%3,r=Math.floor(k/3);const m=el('div','chk',{left:px(xs[c]+4),top:px(d.grid.y0+r*123+4)});m.textContent=n+1;layer.appendChild(m);marks.push(m)})};
  for(let r=0;r<5;r++)for(let c=0;c<3;c++){const k=r*3+c;const y=d.grid.y0+r*123;if(y>650)continue;const b=el('button','hs',{left:px(xs[c]),top:px(y),width:px(115),height:px(115)});b.type='button';b.setAttribute('aria-label','Select media '+(k+1));b.addEventListener('click',e=>{e.stopPropagation();const i=sel.indexOf(k);if(i>=0)sel.splice(i,1);else if(sel.length>=d.grid.cap)toast(scr,'You can select up to 9');else sel.push(k);paint()});layer.appendChild(b)}
  paint()},
 tpl(scr,layer){const xs=[22,108,194,280];let f=el('div','tsel');layer.appendChild(f);const paint=()=>{f.style.left=px(xs[state.tpl]);f.style.top='629px';f.style.display=state.tpl===0?'none':''};
  xs.forEach((x,i)=>{const b=el('button','hs',{left:px(x),top:px(629),width:px(78),height:px(117)});b.type='button';b.setAttribute('aria-label','Template '+(i+1));b.addEventListener('click',e=>{e.stopPropagation();state.tpl=i;paint()});layer.appendChild(b)});paint()},
 gen(scr,layer){const bar=el('div','gen-bar');bar.appendChild(el('i'));layer.appendChild(bar);const sp=el('div','spin',{left:px(352),top:px(694)});layer.appendChild(sp);
  scr._timer=setTimeout(()=>{if(cur==='generating')go('preview','fade')},3400);
  const sk=el('button','hs',{left:px(0),top:px(110),width:px(393),height:px(380)});sk.type='button';sk.setAttribute('aria-label','Skip to result');sk.addEventListener('click',e=>{e.stopPropagation();go('preview','fade')});layer.appendChild(sk)},
 seg(scr,layer){const s=el('div','seg');['Beat Match','Lyric Match'].forEach((t,i)=>{const b=el('button');b.type='button';b.textContent=t;b.addEventListener('click',e=>{e.stopPropagation();state.seg=i;paint();toast(scr,i?'Cuts land on the lyrics':'Cuts land on the beat')});s.appendChild(b)});layer.appendChild(s);
  const paint=()=>[...s.children].forEach((b,i)=>b.classList.toggle('on',i===state.seg));paint()},
 chk(scr,layer){const box=el('div','boxchk',{left:px(24),top:px(793)});layer.appendChild(box);const paint=()=>box.style.display=state.sync?'none':'';
  const b=el('button','hs',{left:px(18),top:px(786),width:px(300),height:px(36)});b.type='button';b.setAttribute('aria-label','Toggle release to community');b.addEventListener('click',e=>{e.stopPropagation();state.sync=!state.sync;paint()});layer.appendChild(b);paint()},
 like(scr,layer){const h=el('div','heart',{left:px(203),top:px(785)});h.textContent='♥';layer.appendChild(h);const n=el('div','heart',{left:px(229),top:px(786),color:'#fff',font:'400 21px system-ui',background:'#151517',padding:'0 4px'});layer.appendChild(n);
  const paint=()=>{h.style.display=state.liked?'':'none';n.style.display=state.liked?'':'none';n.textContent='125'};
  const b=el('button','hs',{left:px(196),top:px(780),width:px(70),height:px(44)});b.type='button';b.setAttribute('aria-label','Like');b.addEventListener('click',e=>{e.stopPropagation();state.liked=!state.liked;paint()});layer.appendChild(b);paint()}
};
const REV={r:'l',l:'r',up:'down',down:'up',fade:'fade'};
function go(id,tr='r',isBack=false){
 if(!S[id])return;const prev=curEl;if(prev&&prev._timer)clearTimeout(prev._timer);
 if(!isBack&&cur)hist.push([cur,tr]);
 const next=build(id);vp.appendChild(next);cur=id;curEl=next;
 const inC={r:'in-r',l:'in-l',up:'in-up',down:'in-fade',fade:'in-fade'}[tr],outC={r:'out-l',l:'out-r',up:'',down:'out-down',fade:'out-fade'}[tr];
 if(prev){next.classList.add(inC);if(tr==='up'){prev.style.zIndex=0;next.style.zIndex=1}if(tr==='down'){prev.style.zIndex=2}if(outC)prev.classList.add(outC);setTimeout(()=>prev.remove(),360)}
 next.classList.toggle('show',showHints);
 cap.innerHTML=`<b>${S[id].name}</b> · ${ORDER.indexOf(id)+1} / ${ORDER.length}${S[id].hint?' — '+S[id].hint:''}`;
 try{history.replaceState(null,'','#'+id)}catch(e){}
}
function back(){const h=hist.pop();if(!h)return;go(h[0],REV[h[1]]||'l',true)}
document.getElementById('restart').onclick=()=>{hist.length=0;Object.assign(state,{song:-1,sel:{artistmedia:[],yourmedia:[]},tpl:1,seg:0,sync:true,liked:false});go('ins','fade',true)};
document.getElementById('jump-make').onclick=()=>{go('music','fade')};
const hb=document.getElementById('hints');hb.onclick=()=>{showHints=!showHints;hb.setAttribute('aria-pressed',showHints);curEl&&curEl.classList.toggle('show',showHints)};
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace')back()});
fit();
addEventListener('message',e=>{const d=e.data||{};if(d.fcEntry&&S[d.fcEntry]){hist.length=0;go(d.fcEntry,'fade',true)}});const start=(location.hash||'').slice(1);go(S[start]?start:'ins','fade',true);
ORDER.forEach(id=>{const i=new Image();i.src='s/'+S[id].img+'.webp'});
</script>
</body></html>
